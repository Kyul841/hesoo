<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>이소희</title>
  <style>
    :root {
      --bg-color: #b2c7d9;
      --bubble-other: #ffffff;
      --bubble-user: #fee500;
      --text-color: #191919;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body {
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .chat-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      position: relative;
    }

    @media (min-width: 480px) {
      .chat-container {
        height: 90vh;
        max-height: 800px;
        border-radius: 16px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        overflow: hidden;
      }
    }

    /* 헤더 */
    .chat-header {
      background-color: var(--bg-color);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .chat-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      background-color: #4a5568;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: bold;
    }

    .profile-info .name {
      font-size: 15px;
      font-weight: bold;
      color: var(--text-color);
    }

    .profile-info .status {
      font-size: 11px;
      color: #555555;
    }

    .settings-btn {
      background: #ffffff;
      border: 1px solid #cccccc;
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    /* 대화 영역 */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .date-divider {
      text-align: center;
      margin: 6px 0;
    }

    .date-divider span {
      background-color: rgba(0, 0, 0, 0.15);
      color: #ffffff;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 10px;
    }

    .msg-group {
      display: flex;
      gap: 8px;
      max-width: 82%;
    }

    .msg-group.other {
      align-self: flex-start;
    }

    .msg-group.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background-color: #4a5568;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      flex-shrink: 0;
    }

    .msg-content {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sender-name {
      font-size: 11px;
      color: #444444;
      margin-left: 2px;
    }

    .bubble-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 4px;
    }

    .msg-group.user .bubble-wrapper {
      flex-direction: row-reverse;
    }

    .bubble {
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
      word-break: break-word;
      color: var(--text-color);
    }

    .other .bubble {
      background-color: var(--bubble-other);
      border-top-left-radius: 2px;
    }

    .user .bubble {
      background-color: var(--bubble-user);
      border-top-right-radius: 2px;
    }

    .msg-time {
      font-size: 10px;
      color: #555555;
      flex-shrink: 0;
    }

    .typing-indicator {
      font-size: 12px;
      color: #555555;
      display: none;
      margin-left: 46px;
      margin-bottom: 6px;
    }

    /* 입력창 */
    .chat-input-area {
      background-color: #ffffff;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      border: 1px solid #dddddd;
      background-color: #f9f9f9;
      border-radius: 18px;
      padding: 9px 14px;
      font-size: 14px;
      outline: none;
    }

    .send-btn {
      background-color: var(--bubble-user);
      border: none;
      border-radius: 16px;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      color: #3b1e1e;
    }

    .send-btn:disabled {
      background-color: #e2e8f0;
      color: #a0aec0;
      cursor: not-allowed;
    }

    /* 모달 */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-content {
      background: white;
      border-radius: 14px;
      padding: 20px;
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 13px;
    }

    .modal-btns {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: #f5f5f5;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-primary {
      background: #fee500;
      border: none;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <!-- 상단 -->
    <div class="chat-header">
      <div class="chat-profile">
        <div class="avatar">소희</div>
        <div class="profile-info">
          <div class="name">이소희</div>
          <div class="status">세광고 3학년</div>
        </div>
      </div>
      <button class="settings-btn" id="openSettings">설정</button>
    </div>

    <!-- 메시지 목록 -->
    <div class="chat-messages" id="chatMessages">
      <div class="date-divider"><span>오늘</span></div>
      <div class="msg-group other">
        <div class="msg-avatar">소희</div>
        <div class="msg-content">
          <div class="sender-name">이소희</div>
          <div class="bubble-wrapper">
            <div class="bubble">야 뭐하냐 학원 끝남?</div>
            <div class="msg-time" id="initialTime">방금</div>
          </div>
        </div>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator">이소희 입력 중...</div>

    <!-- 입력부 -->
    <div class="chat-input-area">
      <input type="text" id="messageInput" class="chat-input" placeholder="메시지 입력..." autocomplete="off" />
      <button id="sendBtn" class="send-btn">전송</button>
    </div>

    <!-- 설정 모달 -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-content">
        <h4 style="font-size: 15px;">OpenAI API Key 설정</h4>
        <p style="font-size: 11px; color: #666; line-height: 1.4;">
          OpenAI 사이트에서 발급받은 키(sk-...)를 입력해주세요. 본인 브라우저에만 안전하게 저장됩니다.
        </p>
        <input type="password" id="apiKeyInput" class="modal-input" placeholder="sk-..." />
        <div class="modal-btns">
          <button class="btn" id="closeSettings">닫기</button>
          <button class="btn btn-primary" id="saveSettings">저장</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const SYSTEM_PROMPT = `
# Role & Identity
너는 고등학교 3학년 남학생 '이소희'야.
- 나이: 19세 (고3)
- 학교: 세광고등학교 재학 중
- 성향: 장난기 많고 털털함. 겉으로는 실없는 소리 하고 툭툭 내뱉지만 속은 깊고 의리 있음.

# Relationship & Secret Dynamic
- 상대방은 다른 학교에 다니는 동갑내기 친구야.
- 너는 상대방을 짝사랑하고 있지만 절대 티를 내지 마.
- 오글거리는 멘트나 플러팅 금지. 츤데레 남사친 모드 유지.

# Linguistic Style
- 전형적인 남고딩 메신저 말투. 1~2문장 단답형.
- 어미: ~했냐?, ~함, ~있으, ~잖어, ~냐, ~지
- 단어: ㅇㅋ, ㄹㅇ?, 음.., ㅋㅋㅋㅋ, ㅡㅡ, 야, 아니 근데
- 가끔 능청스러운 드립 ("부어도 멋있긴 한데 ㅋㅋ 웁스 취소")

# Constraints
- 절대 AI 티 내지 말 것.
- 번역 투 금지, 장문 금지, 실제 카톡처럼 답장할 것.
`;

    let conversationHistory = [
      { role: "system", content: SYSTEM_PROMPT },
      { role: "assistant", content: "야 뭐하냐 학원 끝남?" }
    ];

    const chatMessages = document.getElementById("chatMessages");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const typingIndicator = document.getElementById("typingIndicator");
    const settingsModal = document.getElementById("settingsModal");
    const openSettings = document.getElementById("openSettings");
    const closeSettings = document.getElementById("closeSettings");
    const saveSettings = document.getElementById("saveSettings");
    const apiKeyInput = document.getElementById("apiKeyInput");

    function getCurrentTime() {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, '0');
      const ampm = h >= 12 ? '오후' : '오전';
      h = h % 12 || 12;
      return `${ampm} ${h}:${m}`;
    }
    document.getElementById("initialTime").textContent = getCurrentTime();

    let apiKey = localStorage.getItem("sohee_api_key") || "";
    if (apiKey) apiKeyInput.value = apiKey;

    openSettings.onclick = () => settingsModal.style.display = "flex";
    closeSettings.onclick = () => settingsModal.style.display = "none";
    saveSettings.onclick = () => {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem("sohee_api_key", apiKey);
      settingsModal.style.display = "none";
      alert("API Key가 저장되었습니다.");
    };

    function appendMessage(sender, text) {
      const msgGroup = document.createElement("div");
      msgGroup.className = `msg-group ${sender}`;
      const timeStr = getCurrentTime();

      if (sender === "other") {
        msgGroup.innerHTML = `
          <div class="msg-avatar">소희</div>
          <div class="msg-content">
            <div class="sender-name">이소희</div>
            <div class="bubble-wrapper">
              <div class="bubble">${text}</div>
              <div class="msg-time">${timeStr}</div>
            </div>
          </div>`;
      } else {
        msgGroup.innerHTML = `
          <div class="bubble-wrapper">
            <div class="bubble">${text}</div>
            <div class="msg-time">${timeStr}</div>
          </div>`;
      }
      chatMessages.appendChild(msgGroup);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      const text = messageInput.value.trim();
      if (!text) return;

      if (!apiKey) {
        alert("우측 상단 [설정] 버튼을 눌러 OpenAI API Key를 먼저 입력해주세요!");
        settingsModal.style.display = "flex";
        return;
      }

      appendMessage("user", text);
      conversationHistory.push({ role: "user", content: text });
      messageInput.value = "";

      messageInput.disabled = true;
      sendBtn.disabled = true;
      typingIndicator.style.display = "block";
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const response = await fetch("https://api.openai.com/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: conversationHistory,
            temperature: 0.85,
            max_tokens: 150
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "API 요청에 실패했습니다.");
        }

        const aiReply = data.choices[0].message.content.trim();
        conversationHistory.push({ role: "assistant", content: aiReply });
        appendMessage("other", aiReply);

      } catch (err) {
        console.error(err);
        appendMessage("other", `[오류 발생: ${err.message}]`);
      } finally {
        messageInput.disabled = false;
        sendBtn.disabled = false;
        typingIndicator.style.display = "none";
        messageInput.focus();
      }
    }

    sendBtn.onclick = sendMessage;
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
